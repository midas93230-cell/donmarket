[pytest]
# Marqueurs déclarés ici pour que pytest ne les traite pas comme des fautes de
# frappe (`PytestUnknownMarkWarning`).
markers =
    slow: lance un vrai sous-processus PowerShell (DPAPI). ~5 s par appel sur
        cette machine, contre quelques millisecondes pour tout le reste.

# Pourquoi ce fichier existe : sans marqueur, la suite est passée de 7 s à 134 s
# le jour où les tests DPAPI réels sont arrivés. Une suite qu'on n'ose plus
# lancer ne protège plus rien — c'est un coût de sécurité, pas de confort.
#
#   pytest tests -m "not slow"    boucle de développement (rapide)
#   pytest tests                  avant de commiter (tout, DPAPI compris)
